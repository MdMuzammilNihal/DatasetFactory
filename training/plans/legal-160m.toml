# legal curation recipes (2026-11-19), Pythia-160M, 1 seed. Recipes are CHOSEN on the dev sets (data/eval-dev:
# WikiText-103 validation + legal dev); the test sets (data/eval) are reported once, not used for the choice.
# Same arms as the medical recipe pass. Run from `training`:
#   ../backend/.venv/Scripts/python -m dftrain experiment plans/legal-160m.toml
name = "legal-160m"
model = "EleutherAI/pythia-160m"
budget = "19.8M"
seeds = [0]
reference = "random"
tasks = ["wikitext", "legal"]
shots = [0]
qlora = false
dev_eval = "data/eval-dev"
summary = "summary"

[pretrain]
lr = 6e-5
global_batch = 32
micro_batch = 4

[[arms]]
name = "base"

[[arms]]
name = "random"
description = "same sources, no filters (--mode random)"
parts = ["../backend/runs/legal-random-20261119-134712-0350"]

[[arms]]
name = "curated"
parts = ["../backend/runs/legal-20261119-134712-3ae7"]

[[arms]]
name = "curated-mix"
description = "curated legal 60% + curated general 40%"
parts = ["../backend/runs/legal-20261119-134712-3ae7=0.6", "../backend/runs/general-20261117-184506-8722=0.4"]

[[arms]]
name = "loose-mix"
description = "loose legal (no validator, no score threshold) 60% + curated general 40%"
parts = ["../backend/runs/legal-20261119-134712-337b=0.6", "../backend/runs/general-20261117-184506-8722=0.4"]

[[arms]]
name = "control-random-mix"
description = "random legal without its FineWeb documents 60% + curated general 40%"
parts = ["data/parts/random-legal-only.jsonl=0.6", "../backend/runs/general-20261117-184506-8722=0.4"]
