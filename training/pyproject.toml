[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dftrain"
version = "0.1.0"
description = "Training and evaluation of Pythia models on Dataset Factory corpora (Module 10)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tokenizers",
    "huggingface_hub",
    "datasets",
]

[project.optional-dependencies]
dev = ["pytest"]
# Pretraining (Module 10b). Locally torch comes from the CUDA index:
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
train = ["torch", "transformers>=4.45", "accelerate"]

[tool.setuptools.packages.find]
include = ["dftrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
