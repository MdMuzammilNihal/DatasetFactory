# Ablation: medical with stage 'no-dedup' (generated by scripts/make_ablation_configs.py)
# Dataset Factory configuration.
# Every run records this file's fingerprint in its manifest, so a dataset can
# always be traced back to the exact settings that produced it.

[meta]
config_version = "1.0.0"
seed = 42

# ---------------------------------------------------------------------------
# Stage 1: global filter. Applied to every document regardless of domain.
# Checks run cheapest-first and stop at the first failure (early rejection).
# ---------------------------------------------------------------------------
[global_filter]
language = "en"
min_language_confidence = 0.25       # real English prose scores 0.6-0.98 on a 2000-character sample
language_sample_chars = 2000

min_chars = 200
max_chars = 200000
min_words = 50

max_replacement_char_ratio = 0.002   # U+FFFD and mojibake markers per character
min_alpha_ratio = 0.60               # letters / non-space characters
min_mean_word_length = 3.0
max_mean_word_length = 10.0

max_markup_per_1k_chars = 5.0        # HTML tags and entities
min_stopword_ratio = 0.15            # share of common function words (prose check)
min_unique_word_ratio = 0.25         # measured on the first 500 words

max_duplicate_line_ratio = 0.30      # among lines of 30+ characters
max_repeated_ngram_ratio = 0.30      # repeated word 4-grams in the first 1000 words

# Rejected when (hits >= min_boilerplate_hits and hits per 100 words exceed the
# limit) or when this many different boilerplate phrases appear.
min_boilerplate_hits = 3
max_boilerplate_per_100_words = 1.0
max_boilerplate_distinct = 4

# Names of checks to switch off (used for ablation studies). Valid names:
# length, encoding, alpha_ratio, word_length, markup, language, stopwords,
# information_density, repetition, boilerplate
disabled_checks = []

# Source code is not prose, so the prose-oriented checks are relaxed or off.
[global_filter.overrides.code]
min_chars = 100                     # Go and JavaScript functions are often short (9b: Go yield 38% at 200)
min_words = 15
min_alpha_ratio = 0.35
min_mean_word_length = 2.0
max_mean_word_length = 14.0
min_unique_word_ratio = 0.08
max_duplicate_line_ratio = 0.50
max_repeated_ngram_ratio = 0.60
disabled_checks = ["language", "stopwords", "markup"]

# ---------------------------------------------------------------------------
# Stage 2: domain validators. A document must pass every check of its domain.
# Thresholds were calibrated on real samples with scripts/calibrate.py.
# Each section accepts `disabled_checks = [...]` to switch checks off by name
# (this is how leave-one-out ablations are run).
# ---------------------------------------------------------------------------

# Checks: well_formed, factual_density, neutral_voice, not_promotional
[validators.general]
min_sentences = 3
min_sentence_length = 8
max_sentence_length = 50
min_facts_per_100w = 3.0        # numbers plus named entities
max_person_ratio = 0.03         # share of I/we/you words
max_promotional_hits = 1

# Checks: attribution, factual_anchors, article_structure, no_clickbait, reporting_voice
[validators.news]
min_attributions = 3
min_attributions_per_100w = 1.2
min_proper_nouns_per_100w = 2.5
min_numbers_per_100w = 0.3
min_sentences = 5
min_sentence_length = 10
max_sentence_length = 45
max_clickbait_hits = 0
max_person_ratio = 0.05

# Checks: clinical_structure, factual_grounding, educational_value,
#         topic_coherence, verifiable_claims, misinformation
[validators.medical]
min_structure_cues = 1
min_evidence_terms = 2
min_distinct_terms = 3
min_sentences = 3
min_term_density = 0.03
min_numbers_per_100w = 0.5
max_misinformation_hits = 0

# Checks: citations, legal_terminology, case_structure
[validators.legal]
min_citations = 2
min_term_density = 0.03
min_party_terms = 1
min_court_terms = 1
min_disposition_terms = 1

# Checks: section_structure, citation_density, terminology, substance
[validators.scientific]
min_structure_cues = 3
min_citations = 3
min_citations_per_100w = 0.10
min_term_density = 0.035
min_words = 150

# Checks: syntax_blocks, function_definition, comment_structure, balanced_delimiters
[validators.code]
min_structural_line_ratio = 0.30
min_lines = 4
min_function_definitions = 1
min_comments = 1
max_delimiter_imbalance = 0.10

# ---------------------------------------------------------------------------
# Stage 3: composite quality score.   Q(x) = sum of weight * feature
# A document is accepted when Q(x) >= threshold. Each feature is 0-1 and the
# weights of a domain must sum to 1. Features:
#   terminology, citations, structure, readability, factual_density,
#   lexical_diversity, non_repetition, source_authority, syntactic_validity
# `targets` are the values at which a feature reaches its full score of 1.
# `disabled_features = [...]` switches features off for ablation studies.
# ---------------------------------------------------------------------------
[scoring]
default_authority = 0.5   # used when a source has no authority of its own

# Thresholds were set from the score distribution of real validated documents
# (scripts/calibrate.py scores) so that scoring removes roughly the weakest
# 10-15% in the permissive domains and about 25% in legal and scientific.
[scoring.general]
threshold = 0.72
[scoring.general.weights]
readability = 0.25
factual_density = 0.25
lexical_diversity = 0.15
non_repetition = 0.10
structure = 0.10
terminology = 0.05
source_authority = 0.10
[scoring.general.targets]
term_density = 0.02
citations_per_100w = 1.0
structure_cues = 5
facts_per_100w = 12

[scoring.news]
threshold = 0.72
[scoring.news.weights]
citations = 0.20
factual_density = 0.20
readability = 0.20
structure = 0.10
lexical_diversity = 0.10
non_repetition = 0.05
source_authority = 0.15
[scoring.news.targets]
term_density = 0.03
citations_per_100w = 4.0
structure_cues = 3
facts_per_100w = 12

[scoring.medical]
threshold = 0.70
[scoring.medical.weights]
terminology = 0.25
structure = 0.20
factual_density = 0.20     # abstracts rarely carry citations, so numbers stand in
readability = 0.10
non_repetition = 0.05
lexical_diversity = 0.05
source_authority = 0.15
[scoring.medical.targets]
term_density = 0.10
citations_per_100w = 0.5
structure_cues = 6
facts_per_100w = 4

[scoring.legal]
threshold = 0.74
[scoring.legal.weights]
citations = 0.25
terminology = 0.20
structure = 0.15
readability = 0.10
factual_density = 0.05
non_repetition = 0.05
lexical_diversity = 0.05
source_authority = 0.15
[scoring.legal.targets]
term_density = 0.08
citations_per_100w = 2.5
structure_cues = 3
facts_per_100w = 6

[scoring.scientific]
threshold = 0.74
[scoring.scientific.weights]
citations = 0.20
terminology = 0.20
structure = 0.20
readability = 0.10
factual_density = 0.05
non_repetition = 0.05
lexical_diversity = 0.05
source_authority = 0.15
[scoring.scientific.targets]
term_density = 0.08
citations_per_100w = 1.0
structure_cues = 8
facts_per_100w = 4

[scoring.code]
threshold = 0.74
[scoring.code.weights]
syntactic_validity = 0.40
citations = 0.15
structure = 0.15
terminology = 0.10
lexical_diversity = 0.10
non_repetition = 0.05
source_authority = 0.05
[scoring.code.targets]
term_density = 0.20
citations_per_100w = 5.0
structure_cues = 1
facts_per_100w = 4

# ---------------------------------------------------------------------------
# Stage 4: learned quality classifier (one small linear model per domain).
# A document that passed the rules must also be judged, by the trained model,
# to resemble trusted text of its domain: probability >= min_probability.
# Set enabled = false to curate with the rules alone.
# Train or retrain with:  python scripts/train_classifier.py
# ---------------------------------------------------------------------------
[classifier]
enabled = true
min_probability = 0.5
model_dir = "models"      # relative to the backend folder

# General knowledge is deliberately broad. Its classifier is trained on
# Wikipedia, so 0.5 would keep little else; 0.2 still removes forum posts and
# directory pages while keeping news, science and well-written web articles.
[classifier.min_probability_by_domain]
general = 0.2

# ---------------------------------------------------------------------------
# Personal-information scrubbing. Applied to accepted documents before they are
# written; each match is replaced by a placeholder such as [EMAIL].
# Types: email, phone, ip, card, id_number
# ---------------------------------------------------------------------------
[pii]
enabled = true
types = ["email", "phone", "ip", "card", "id_number"]

# In source code, dotted numbers are usually versions and digit groups are
# usually constants, so those two types are left alone there.
[pii.skip_by_domain]
code = ["phone", "ip"]

# ---------------------------------------------------------------------------
# Stage 5: deduplication. Exact copies are removed by content hash; near
# copies by MinHash: a document is dropped when its estimated Jaccard
# similarity (over word 5-grams) to an earlier accepted document reaches the
# threshold. bands x rows controls the candidate search and must not exceed
# num_perm; the defaults find 99.7% of pairs at similarity 0.85.
# ---------------------------------------------------------------------------
[dedup]
enabled = false
threshold = 0.85
num_perm = 128
bands = 12
rows = 6
shingle_size = 5

# ---------------------------------------------------------------------------
# Licences. Every record carries the licence of its source corpus. Licence ids
# listed under `blocked` never enter a dataset, e.g. ["cc-by-nc-4.0"] to build
# a dataset that is safe for commercial use.
# ---------------------------------------------------------------------------
[licenses]
allow_unknown = true
blocked = []

# ---------------------------------------------------------------------------
# Runtime: how a curation job runs (1-4 worker processes,
# chunks of 1,000 documents, a checkpoint every 10,000 documents).
#   workers           worker processes; 0 runs everything in the main process
#   chunk_size        candidate documents sent to a worker at a time
#   checkpoint_every  candidates read between two checkpoints
#   tokenizer         Hugging Face model whose tokenizer counts tokens (the
#                     Pythia / GPT-NeoX tokenizer); "none" turns counting off
#   log_rejections    write one line per rejected document (no text) to
#                     rejections.jsonl, so every decision can be audited
#   output_dir        where job folders are created, relative to the backend folder
# ---------------------------------------------------------------------------
[runtime]
workers = 4
chunk_size = 1000
checkpoint_every = 10000
tokenizer = "EleutherAI/pythia-160m"
log_rejections = true
output_dir = "runs"

# ---------------------------------------------------------------------------
# Sources: the corpora documents are read from. Hugging Face datasets are
# streamed, never downloaded in full. kind = "jsonl" reads a local file of
# JSON lines (path relative to the backend folder), in file order.
#   text           field holding the text, or "builder:<name>" for corpora that
#                  need assembling (see TEXT_BUILDERS in sources.py)
#   license        licence of the corpus, as declared on its dataset page
#                  (checked 2026-11-13); "unknown" where the page declares none
#   license_field  per-document licence field, for corpora that carry one
#   authority      trust level 0-1, used by the scorer's source_authority feature
#   shuffle_buffer documents are drawn at random from a window of this size
#                  (seeded, so the order is reproducible); 0 keeps corpus order
# ---------------------------------------------------------------------------
[sources.fineweb]            # filtered CommonCrawl web text; the baseline web corpus
path = "HuggingFaceFW/fineweb"
data_files = ["sample/10BT/*.parquet"]   # the 10-billion-token sample. Naming the files
                                         # opens in 8 s; name = "sample-10BT" takes 96 s
text = "text"
id_field = "id"
url_field = "url"
license = "odc-by-1.0"
authority = 0.40

[sources.wikipedia]
path = "wikimedia/wikipedia"
name = "20231101.en"
text = "text"
id_field = "id"
url_field = "url"
license = "cc-by-sa-3.0"
authority = 0.85

[sources.cnn_dailymail]      # the dataset page says Apache 2.0; the articles
path = "abisee/cnn_dailymail"   # themselves remain their publishers' copyright
name = "3.0.0"
text = "article"
id_field = "id"
license = "apache-2.0"
authority = 0.75

[sources.cc_news]
path = "vblagoje/cc_news"
text = "text"
url_field = "url"
license = "unknown"
authority = 0.65

[sources.pubmed]             # abstracts; a spread of files so all decades are covered
path = "MedRAG/pubmed"
data_files = ["chunk/pubmed23n0150.jsonl", "chunk/pubmed23n0220.jsonl", "chunk/pubmed23n0290.jsonl", "chunk/pubmed23n0360.jsonl", "chunk/pubmed23n0430.jsonl", "chunk/pubmed23n0500.jsonl", "chunk/pubmed23n0570.jsonl", "chunk/pubmed23n0640.jsonl", "chunk/pubmed23n0710.jsonl", "chunk/pubmed23n0780.jsonl", "chunk/pubmed23n0850.jsonl", "chunk/pubmed23n0920.jsonl", "chunk/pubmed23n0990.jsonl", "chunk/pubmed23n1060.jsonl", "chunk/pubmed23n1130.jsonl"]
text = "contents"
id_field = "id"
license = "unknown"
authority = 0.90

[sources.pubmedqa]
path = "qiaojin/PubMedQA"
name = "pqa_unlabeled"
text = "builder:pubmedqa"
id_field = "pubid"
license = "mit"
authority = 0.90

[sources.caselaw]            # US court opinions; each document states its licence
path = "common-pile/caselaw_access_project"
text = "text"
id_field = "id"
url_field = "metadata.url"
license = "public-domain"
license_field = "metadata.license"
authority = 0.90

[sources.arxiv]              # openly licensed papers; each document states its licence
path = "common-pile/arxiv_papers"
text = "text"
id_field = "id"
url_field = "metadata.url"
license = "unknown"
license_field = "metadata.license"
authority = 0.85

[sources.arxiv_summarization]
path = "ccdv/arxiv-summarization"
name = "document"
text = "article"
license = "unknown"
authority = 0.80

[sources.code_python]        # functions from open-source repositories (licences vary per repository)
path = "code-search-net/code_search_net"
name = "python"
text = "builder:code_with_doc"
url_field = "func_code_url"
license = "mixed-open-source"
authority = 0.75

[sources.code_java]
path = "code-search-net/code_search_net"
name = "java"
text = "builder:code_with_doc"
url_field = "func_code_url"
license = "mixed-open-source"
authority = 0.75

[sources.code_javascript]
path = "code-search-net/code_search_net"
name = "javascript"
text = "builder:code_with_doc"
url_field = "func_code_url"
license = "mixed-open-source"
authority = 0.75

[sources.code_go]
path = "code-search-net/code_search_net"
name = "go"
text = "builder:code_with_doc"
url_field = "func_code_url"
license = "mixed-open-source"
authority = 0.75

[sources.synthetic]          # built-in generator: offline fallback, demos and tests
kind = "synthetic"
license = "synthetic"
authority = 0.50

# ---------------------------------------------------------------------------
# Domains and source routing. The Factory agent reads the `factory` sources
# (structured, trusted repositories); the Generator agent reads the `generator`
# sources (large web corpora). factory_share is the share of candidate
# documents taken from the Factory agent.
# ---------------------------------------------------------------------------
[domains.general]
label = "General Knowledge"
description = "Wikipedia-style factual content"
factory = ["wikipedia"]
generator = ["fineweb"]
factory_share = 0.5

[domains.news]
label = "High-Quality News"
description = "Journalism, validated reporting"
factory = ["cnn_dailymail", "cc_news"]
generator = ["fineweb"]
factory_share = 0.6

[domains.medical]
label = "Medical Reports"
description = "Clinical notes, research papers, case studies"
factory = ["pubmed", "pubmedqa"]
generator = ["fineweb"]
factory_share = 0.8

[domains.legal]
label = "Legal Case Law"
description = "Court details, statutes, contracts"
factory = ["caselaw"]
generator = ["fineweb"]
factory_share = 0.85

[domains.scientific]
label = "Scientific Papers"
description = "Academic research, experiments, citations"
factory = ["arxiv", "arxiv_summarization"]
generator = ["fineweb"]
factory_share = 0.85

[domains.code]
label = "Source Code"
description = "Python, Java, JS, etc. (function level)"
factory = ["code_python", "code_java", "code_javascript", "code_go"]
generator = ["fineweb"]
factory_share = 0.9
